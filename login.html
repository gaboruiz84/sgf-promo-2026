<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - SGF Promo 2026</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-app: #F3F4F6; --bg-card: #FFFFFF; --primary: #111827; --accent: #2563EB; --danger: #EF4444; --border: #E5E7EB; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-app); display: flex; align-items: center; justify-content: center; height: 100vh; padding: 1rem; }
        
        .login-card { background: var(--bg-card); padding: 2.5rem 1.5rem; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); width: 100%; max-width: 380px; text-align: center; }
        .logo-box { width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; margin: 0 auto 1rem auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 0.25rem; font-weight: 700; letter-spacing: -0.5px;}
        p { color: #6B7280; font-size: 0.9rem; margin-bottom: 2rem; }
        
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; color: var(--primary); }
        input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; transition: 0.2s; background: #F9FAFB; }
        input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn-primary { width: 100%; background: var(--accent); color: white; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        /* Botón para espectadores */
        .btn-secondary { width: 100%; background: #F3F4F6; color: var(--primary-light); padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 1rem; }
        .btn-secondary:active { background: #E5E7EB; }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 1.5rem 0; color: #9CA3AF; font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 1rem; display: none; font-weight: 500; background: #FEF2F2; padding: 10px; border-radius: 8px; border: 1px solid #FCA5A5;}
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-box">$</div>
        <h1>SGF.9no</h1>
        <p>Sistema de Gestión Financiera</p>

        <form id="login-form">
            <div class="form-group">
                <label>Usuario / Cargo (Opcional)</label>
                <input type="text" id="usuario" placeholder="Ej: Tesorera" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>PIN de Seguridad Directiva</label>
                <input type="password" id="pin" placeholder="****" required pattern="[0-9]*" inputmode="numeric">
            </div>
            
            <button type="submit" class="btn-primary" id="btn-login">Ingresar como Directiva</button>
            <div class="error-msg" id="error-msg">PIN incorrecto. Intenta de nuevo.</div>
        </form>

        <div class="divider">O</div>

        <button type="button" class="btn-secondary" onclick="entrarComoEspectador()">
            👁️ Entrar como Espectador
        </button>
    </div>

    <script>
        // TU URL OFICIAL
        const API_URL = "https://script.google.com/macros/s/AKfycbxfJPvUGrzOR55e3uGwjDKaGPtXjsCPE0Y6nFDjFTvgjQy5-5f6aw406QMeta8i58z1fg/exec";
        
        // Si el usuario ya había iniciado sesión antes, lo mandamos directo al Dashboard
        if (localStorage.getItem("usuarioLogueado")) {
            window.location.href = "index.html";
        }

        // Lógica para el botón de Espectador
        function entrarComoEspectador() {
            localStorage.setItem("usuarioLogueado", "Invitado");
            localStorage.setItem("cargoUsuario", "Espectador");
            localStorage.setItem("modoApp", "lectura"); 
            window.location.href = "index.html";
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-msg');
            
            if (!pin) return;

            // Estado de carga
            btn.innerHTML = "⏳ Verificando...";
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ accion: 'validar_login', usuario: usuario, pin: pin })
                });
                
                const data = await response.json();
                
                if (data.exito) {
                    const nombreOficial = data.nombre || (data.usuario && data.usuario.nombre) || "Usuario";
                    const cargoOficial = data.cargo || (data.usuario && data.usuario.cargo) || "Miembro";
                    const modoOficial = data.modo || "edicion";

                    localStorage.setItem("usuarioLogueado", nombreOficial);
                    localStorage.setItem("cargoUsuario", cargoOficial);
                    localStorage.setItem("modoApp", modoOficial);
                    
                    btn.innerHTML = "✓ Acceso concedido";
                    btn.style.background = "#10B981";
                    
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 500);
                } else {
                    errorMsg.innerText = data.mensaje || "Credenciales incorrectas.";
                    errorMsg.style.display = 'block';
                    btn.innerHTML = "Ingresar como Directiva";
                    btn.disabled = false;
                }
            } catch (error) {
                errorMsg.innerText = "Error de conexión. Revisa tu internet y vuelve a intentar.";
                errorMsg.style.display = 'block';
                btn.innerHTML = "Ingresar como Directiva";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
